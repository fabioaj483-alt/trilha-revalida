<script>
const SUPABASE_URL = 'https://hizgqlftbejocvrgugl.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhpemdxbGZ0YmVqb2N2cmd1Z2wiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTczODE0NjIxOCwiZXhwIjoyMDUzNzIyMjE4fQ.J-JN0ub1FAmjW72zhTSwie9UgHHIoagcRfARPURJBys';

const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const USER_DATA_ID = 'meu_progresso_revalida';

let appData = { blocks: {}, questoes: 0, acertos: 0 };

async function loadData() {
  try {
    const { data, error } = await _supabase
      .from('progresso_estudos')
      .select('data')
      .eq('id', USER_DATA_ID)
      .maybeSingle();

    if (data && data.data) {
      appData = data.data;
      renderState();
    }
  } catch (err) {
    console.error(err);
  }
}

async function saveData() {
  appData.questoes = parseInt(document.getElementById('inpQ').value) || 0;
  appData.acertos = parseInt(document.getElementById('inpA').value) || 0;

  renderState();

  // Tenta atualizar primeiro
  const { data: updateData, error: updateError } = await _supabase
    .from('progresso_estudos')
    .update({ data: appData, updated_at: new Date() })
    .eq('id', USER_DATA_ID)
    .select();

  // Se não existia o registro ainda, cria um novo (INSERT)
  if (!updateError && (!updateData || updateData.length === 0)) {
    const { error: insertError } = await _supabase
      .from('progresso_estudos')
      .insert({ id: USER_DATA_ID, data: appData, updated_at: new Date() });

    if (!insertError) {
      alert('Progresso criado e salvo com sucesso!');
      return;
    } else {
      alert('Erro no Supabase: ' + insertError.message);
      return;
    }
  }

  if (!updateError) {
    alert('Dados salvos na nuvem com sucesso!');
  } else {
    alert('Erro no Supabase: ' + updateError.message);
  }
}

function renderState() {
  document.getElementById('inpQ').value = appData.questoes || '';
  document.getElementById('inpA').value = appData.acertos || '';

  document.querySelectorAll('.block-check').forEach(btn => {
    const key = btn.dataset.blockkey;
    if (appData.blocks && appData.blocks[key]) btn.classList.add('done');
    else btn.classList.remove('done');
  });

  if (appData.questoes > 0) {
    const pct = Math.round((appData.acertos / appData.questoes) * 100);
    document.getElementById('ringPct').innerText = `${pct}%`;
    document.getElementById('ringSub').innerText = `${appData.acertos} acertos de ${appData.questoes} questões`;
    
    if (document.getElementById('statTotalQ')) {
      document.getElementById('statTotalQ').innerText = appData.questoes;
      document.getElementById('statTotalA').innerText = appData.acertos;
      document.getElementById('statPct').innerText = `${pct}%`;
    }
  }
}

function toggleBlock(key) {
  if (!appData.blocks) appData.blocks = {};
  appData.blocks[key] = !appData.blocks[key];
  renderState();
  saveData();
}

function switchTab(tabId, e) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById(`view-${tabId}`).classList.add('active');
  if (e) e.currentTarget.classList.add('active');
}

loadData();
</script>
